name: Rust engine and HTTP checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt
      - run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - run: cargo test --manifest-path engine/Cargo.toml --locked
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
